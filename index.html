<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>世界地図ビューア - 過速世界</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="map2d" hidden></div>
  <div id="loading">読み込み中…</div>
  <div id="sea-level-control">
    <div class="control-row">
      <label>天体</label>
      <div id="world-switch" class="segmented"></div>
    </div>
    <div class="control-row">
      <label for="sea-level-slider" id="sea-level-label">海面の高さ</label>
      <input type="range" id="sea-level-slider" min="-300" max="100" step="1" value="0" />
      <span id="sea-level-readout">±0m</span>
    </div>
    <p id="virtual-sea-note" hidden>※実際には海はありません。「ここまで水があったら
      どこが海になるか」を見るための仮想の海面です。</p>
    <div class="control-row">
      <label for="water-opacity-slider">海の濃さ</label>
      <input type="range" id="water-opacity-slider" min="0" max="100" step="5" value="40" />
      <span id="water-opacity-readout">40%</span>
    </div>
    <div class="control-row">
      <button type="button" id="axis-toggle" class="pill">軸 垂直</button>
      <span id="axis-readout">0°</span>
      <button type="button" id="graticule-toggle" class="pill">線 なし</button>
    </div>
    <div class="control-row" id="surface-row">
      <label>地表</label>
      <div id="surface-mode" class="segmented">
        <button type="button" data-surface="standard" class="selected">標準</button>
        <button type="button" data-surface="rock">岩</button>
        <button type="button" data-surface="climate">陸地塗り分け</button>
        <button type="button" data-surface="teacher" id="teacher-button">教師</button>
      </div>
    </div>
    <div class="control-row" id="climate-set-row" hidden>
      <label>気候</label>
      <div id="climate-set" class="segmented"></div>
    </div>
    <div class="control-row" id="climate-temp-row" hidden>
      <label for="climate-temp-slider">平均気温</label>
      <input type="range" id="climate-temp-slider" min="5" max="25" step="1" value="14" />
      <span id="climate-temp-readout">14℃</span>
    </div>
    <div class="control-row" id="seabed-row">
      <label>海底の色</label>
      <div id="seabed-style" class="segmented">
        <button type="button" data-style="photo" class="selected">写真</button>
        <button type="button" data-style="brown">茶</button>
        <button type="button" data-style="grey">灰</button>
        <button type="button" data-style="land">緑茶</button>
      </div>
    </div>
  </div>
  <button id="view-toggle">2Dに切替</button>
  <div id="scale-bar" hidden>
    <div id="scale-bar-line"></div>
    <span id="scale-bar-label"></span>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
