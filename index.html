<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>世界地図ビューア - 過速世界</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="map2d" hidden></div>
  <div id="loading">読み込み中…</div>
  <div id="sea-level-control" class="panel">
    <!-- Hidden for now, deliberately NOT removed: these come back when the
         standard conditions reproduce the real Earth well enough to be worth
         adjusting. js/main.js keeps them hidden rather than re-showing them
         per world. -->
    <div class="control-row" id="sea-level-row" hidden>
      <label for="sea-level-slider" id="sea-level-label">海面の高さ</label>
      <input type="range" id="sea-level-slider" min="-300" max="100" step="1" value="0" />
      <span id="sea-level-readout">±0m</span>
    </div>
    <p id="virtual-sea-note" hidden>※実際には海はありません。「ここまで水があったら
      どこが海になるか」を見るための仮想の海面です。</p>
    <div class="control-row" id="water-opacity-row" hidden>
      <label for="water-opacity-slider">海の濃さ</label>
      <input type="range" id="water-opacity-slider" min="0" max="100" step="5" value="40" />
      <span id="water-opacity-readout">40%</span>
    </div>
    <div class="control-row" id="surface-row">
      <label>地表</label>
      <div id="surface-mode" class="segmented">
        <button type="button" data-surface="hypsometric">未調整</button>
        <button type="button" data-surface="standard" class="selected">標準</button>
        <button type="button" data-surface="rock">岩</button>
        <button type="button" data-surface="climate">陸地塗り分け</button>
        <button type="button" data-surface="teacher" id="teacher-button">教師</button>
      </div>
    </div>
    <div class="control-row" id="climate-set-row" hidden>
      <label>気候</label>
      <div id="climate-set" class="segmented"></div>
    </div>
    <div class="control-row" id="climate-temp-row" hidden>
      <label for="climate-temp-slider">平均気温</label>
      <input type="range" id="climate-temp-slider" min="5" max="25" step="1" value="14" />
      <span id="climate-temp-readout">14℃</span>
    </div>
    <p id="climate-score" hidden></p>
    <p id="climate-compare-score" hidden></p>
    <div class="control-row" id="seabed-row" hidden>
      <label>海底の色</label>
      <div id="seabed-style" class="segmented">
        <button type="button" data-style="photo" class="selected">写真</button>
        <button type="button" data-style="brown">茶</button>
        <button type="button" data-style="grey">灰</button>
        <button type="button" data-style="land">緑茶</button>
      </div>
    </div>
  </div>
  <div id="bottom-controls">
    <div id="bottom-panel" class="panel">
      <!-- The body cycles on the left, the view toggles on the right, one
           row. They used to float in the screen corners; folded back in here
           they cost one row instead of two corner buttons' worth of margin. -->
      <div class="control-row" id="nav-row">
        <button type="button" id="world-cycle" class="pill">天体 地球</button>
        <button type="button" id="view-toggle" class="pill">2Dに切替</button>
      </div>
      <!-- Hidden for now, deliberately NOT removed: the tilt and graticule
           still work, they are just not on screen. -->
      <div class="control-row" id="axis-row" hidden>
        <button type="button" id="axis-toggle" class="pill">軸 垂直</button>
        <span id="axis-readout">0°</span>
        <button type="button" id="graticule-toggle" class="pill">線 なし</button>
      </div>
      <!-- Climate v1 preview. EXPERIMENTAL: a separate pipeline from the 地表
           colouring above, off until asked for, and it changes nothing about
           what 標準 / 岩 / 陸地塗り分け / 教師 draw. -->
      <!-- Variable and source on one row: five exclusive states, so there is
           no way to be in a combination that means nothing. -->
      <div class="control-row" id="climatev1-row" hidden>
        <div id="climatev1-mode" class="segmented">
          <button type="button" data-v1="off" class="selected">温湿度OFF</button>
          <button type="button" data-v1="temperature-model">気温モデル</button>
          <button type="button" data-v1="temperature-teacher" title="実測の年平均地表気温">気温教師</button>
          <button type="button" data-v1="humidity-model">湿度モデル</button>
          <button type="button" data-v1="humidity-teacher" title="実測の2m比湿（NCEP）">湿度教師</button>
        </div>
      </div>
      <div class="control-row" id="climatev1-options" hidden>
        <div id="climatev1-cooling" class="segmented">
          <button type="button" data-cooling="off" class="selected">蒸発冷却 切</button>
          <button type="button" data-cooling="on">入</button>
        </div>
        <div id="climatev1-wind" class="segmented">
          <button type="button" data-wind="model" class="selected" title="モデル計算風（Climate v1 Stage 4）">現行風</button>
          <button type="button" data-wind="observed" title="NCEP 850hPa 観測風・診断用">観測風</button>
        </div>
      </div>
      <!-- The seasonal cycle (EXPERIMENTAL, temperature only). One row, and
           it only exists while 気温モデル is on screen: the teacher data is an
           annual mean, and humidity is not seasonal in this model, so showing
           this beside either would claim something untrue. -->
      <div class="control-row" id="season-row" hidden>
        <div id="season-mode" class="segmented">
          <button type="button" data-season="annual" class="selected">年間</button>
          <button type="button" data-season="seasonal" title="気温だけが季節変化します">季節</button>
        </div>
        <button type="button" id="season-prev" class="pill" hidden>◀</button>
        <input type="range" id="season-phase" min="0" max="1439" step="1" value="360" hidden />
        <button type="button" id="season-next" class="pill" hidden>▶</button>
        <button type="button" id="season-play" class="pill" hidden>再生</button>
      </div>
      <p id="climatev1-readout" hidden></p>
    </div>
  </div>
  <div id="scale-bar" hidden>
    <div id="scale-bar-line"></div>
    <span id="scale-bar-label"></span>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
