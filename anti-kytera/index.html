<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Anti-KyTerra 比較地球儀</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#0b0f16; --panel:rgba(16,22,32,.86); --fg:#e8edf4; --muted:#9aa7b8; --acc:#5aa9ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; overflow:hidden; }
  #globe { position:fixed; inset:0; }
  .panel { position:fixed; left:8px; right:8px; background:var(--panel); border-radius:10px;
    padding:6px 8px; font-size:13px; }
  #top { top:8px; }
  #bottom { bottom:8px; }
  .row { display:flex; gap:4px; align-items:center; margin:3px 0; }
  .row .lab { color:var(--muted); width:3.2em; flex:none; }
  button { flex:1; background:#1d2838; color:var(--fg); border:1px solid #2f3d52; border-radius:7px;
    padding:6px 2px; font-size:13px; }
  button.on { background:var(--acc); color:#04121f; border-color:var(--acc); font-weight:600; }
  #legend { display:flex; align-items:center; gap:6px; }
  #bar { flex:1; min-width:0; width:10px; height:10px; border-radius:3px; }
  #legend span { flex:none; }
  #readout { font-variant-numeric: tabular-nums; }
  #note { color:var(--muted); font-size:11px; line-height:1.35; }
  #cross { position:fixed; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px;
    pointer-events:none; }
  #cross:before,#cross:after { content:""; position:absolute; background:#fff; opacity:.8; }
  #cross:before { left:6px; top:0; width:2px; height:14px; }
  #cross:after { top:6px; left:0; height:2px; width:14px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
<div id="globe"></div>
<div id="cross"></div>
<div id="loading">読み込み中…</div>
<div class="panel" id="top">
  <div class="row"><span class="lab">変数</span>
    <button data-var="t2m" class="on">気温</button><button data-var="precip">降水</button><button data-var="ice">陸氷</button></div>
  <div class="row"><span class="lab">表示</span>
    <button data-src="model" class="on">モデル</button><button data-src="teacher">教師</button><button data-src="diff">差</button></div>
  <div class="row" id="runs"><span class="lab">計算</span></div>
  <div id="legend"><span id="lo"></span><canvas id="bar" width="256" height="1"></canvas><span id="hi"></span><span id="unit"></span></div>
</div>
<div class="panel" id="bottom">
  <div id="readout">中央: –</div>
  <div id="note"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
