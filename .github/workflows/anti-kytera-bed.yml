# Anti-KyTerra: fetch Earth's sub-ice bedrock (GEBCO_2026 "sub-ice topography
# / bathymetry") on a runner, because the dev sandbox cannot reach CEDA and
# the source is 7.5 GB.
#
# Out: anti-kytera/data/gebco2026_subice_2048x1024.png (rg16-metres, offset
# 12000, same encoding as worlds/kasoku-sekai/terrain). Ice thickness for the
# bedrock restoration and the final comparison is the committed ice-surface
# raster minus this one.
#
# Runs on a push that touches this file (so it can be started from a branch
# without the Actions tab), or by hand.

name: Anti-KyTerra bedrock data

on:
  workflow_dispatch:
  push:
    branches: [claude/anti-kytera-initial-implementation-lx6p6s]
    paths: [.github/workflows/anti-kytera-bed.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin aria2 >/dev/null
          python3 -m pip install --quiet --break-system-packages numpy pillow

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1

      - name: Download GEBCO_2026 sub-ice topography
        run: |
          DIR=https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/sub_ice_topography_bathymetry/netcdf/
          # The exact file name is read from the directory listing rather than
          # guessed; it has changed between GEBCO releases.
          NAME=$(curl -sSL "$DIR" | grep -o 'GEBCO_2026[A-Za-z0-9_]*\.nc' | sort -u | head -1)
          echo "file: $NAME"
          test -n "$NAME"
          URL="$DIR$NAME"
          aria2c -x 12 -s 12 -k 4M --file-allocation=none --console-log-level=warn \
                 -o source.nc "$URL" \
            || curl -sSL --retry 3 -o source.nc "$URL"
          ls -l source.nc
          gdalinfo source.nc | head -20

      - name: Area-average to 2048x1024 and encode
        env:
          PYTHONPATH: tools
        run: |
          set -e
          gdal_translate -q -of ENVI -ot Int16 -r average -outsize 2048 1024 source.nc bed.bin
          rm -f source.nc
          python3 tools/encode_elevation.py bed.bin 2048 1024 \
            anti-kytera/data/gebco2026_subice_2048x1024.png worlds/kasoku-sekai
          ls -l anti-kytera/data

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anti-kytera/data/gebco2026_subice_2048x1024.png
          if git diff --cached --quiet; then echo unchanged; exit 0; fi
          git commit -m "Anti-KyTerra: GEBCO_2026 sub-ice bedrock, 2048x1024" \
            -m "Generated by .github/workflows/anti-kytera-bed.yml (area-averaged on the runner)."
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
