# Builds the globe's terrain data from GEBCO_2026, entirely on GitHub's
# runners. The point is that nobody has to touch the source grid by hand:
# it is 7.5 GB, and the only machine this project's owner has is a phone.
#
# In:  GEBCO_2026 ice-surface grid (86400 x 43200, Int16 metres) from CEDA.
# Out: a handful of small PNGs committed under worlds/<world>/terrain/.
#      The 7.5 GB source is never committed and never reaches the web app.
#
# Run it from the Actions tab ("Run workflow"). It takes roughly half an
# hour, almost all of it waiting on CEDA (~5 MB/s observed).

name: Build terrain from GEBCO

on:
  workflow_dispatch:
    inputs:
      world:
        description: World id under worlds/
        default: kasoku-sekai
      commit:
        description: Commit the generated rasters back to the branch
        type: boolean
        default: true

permissions:
  contents: write

env:
  SOURCE_URL: https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/ice_surface_elevation/netcdf/GEBCO_2026.nc
  # Widest level built. Every smaller level is averaged down from this one
  # instead of re-reading the 7.5 GB source once per level.
  BASE_WIDTH: 4096
  BASE_HEIGHT: 2048

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install GDAL and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin aria2 >/dev/null
          python3 -m pip install --quiet --break-system-packages numpy pillow
          gdalinfo --version

      - name: Download the GEBCO_2026 ice-surface grid
        run: |
          # CEDA gives roughly 5 MB/s on a single connection, so pull it
          # over several in parallel; fall back to curl if aria2 is unhappy.
          aria2c -x 12 -s 12 -k 4M --file-allocation=none --console-log-level=warn \
                 -o GEBCO_2026.nc "$SOURCE_URL" \
            || curl -sSL --retry 3 -o GEBCO_2026.nc "$SOURCE_URL"
          ls -l GEBCO_2026.nc
          gdalinfo GEBCO_2026.nc | head -12

      - name: Downsample to the base level (area-average, not point sampling)
        run: |
          # -r average matters: decimating a heightmap by picking every Nth
          # cell would drop peaks and trenches entirely. Averaging keeps each
          # output cell representative of the ground it covers.
          gdal_translate -q -of GTiff -ot Int16 -r average \
            -outsize "$BASE_WIDTH" "$BASE_HEIGHT" \
            -a_srs EPSG:4326 \
            GEBCO_2026.nc base.tif
          rm -f GEBCO_2026.nc
          gdalinfo -stats base.tif | egrep 'Size is|Minimum=|STATISTICS_(MIN|MAX|MEAN)'

      - name: Encode the pyramid as PNG elevation rasters
        run: |
          set -e
          world="${{ inputs.world }}"
          outdir="worlds/${world}/terrain"
          mkdir -p "$outdir"

          for size in "4096 2048" "2048 1024" "1024 512" "512 256"; do
            set -- $size
            w=$1; h=$2
            if [ "$w" = "$BASE_WIDTH" ]; then
              cp base.tif "level_${w}.tif"
            else
              gdal_translate -q -of GTiff -ot Int16 -r average \
                -outsize "$w" "$h" base.tif "level_${w}.tif"
            fi
            # ENVI gives a plain little-endian Int16 dump that numpy can read
            # directly, which avoids depending on GDAL's Python bindings.
            gdal_translate -q -of ENVI -ot Int16 "level_${w}.tif" "level_${w}.bin"
            python3 tools/encode_elevation.py "level_${w}.bin" "$w" "$h" \
              "${outdir}/gebco2026_ice_${w}x${h}.png"
          done

          ls -l "$outdir"

      - name: Verify the result is real global terrain
        run: |
          python3 tools/verify_elevation.py \
            "worlds/${{ inputs.world }}/terrain/gebco2026_ice_2048x1024.png"

      - name: Commit the generated rasters
        if: ${{ inputs.commit }}
        run: |
          world="${{ inputs.world }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "worlds/${world}/terrain"
          if git diff --cached --quiet; then
            echo "terrain rasters unchanged"
            exit 0
          fi
          git commit \
            -m "Rebuild ${world} terrain from GEBCO_2026 ice-surface grid" \
            -m "Generated by .github/workflows/build-terrain.yml. The 7.5GB source grid was downloaded, area-averaged and encoded on the runner; only the small PNG levels are committed."
          git push origin HEAD:"${{ github.ref_name }}"
