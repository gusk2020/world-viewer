# Throwaway: finds out what MOLA (Mars) and LOLA (Moon) data is actually
# reachable and what it says about itself. This sandbox's egress proxy
# blocks every planetary-data host, so a runner does the looking -- the
# same trick that established the GEBCO/CEDA layout for V0.6. Delete this
# file once the real build workflow exists.
name: Probe planetary DEMs

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin >/dev/null
          gdalinfo --version

      - name: Reachability -- headers only, no downloads
        run: |
          set +e
          probe() {
            echo "=== $1"
            curl -sSIL --max-time 45 "$1" \
              | egrep -i '^(HTTP/|content-length|content-type|last-modified)' \
              | tail -6
            echo
          }
          # Mars: USGS Astrogeology global MOLA mosaics.
          probe https://planetarymaps.usgs.gov/mosaic/Mars_MGS_MOLA_DEM_mosaic_global_463m.tif
          probe https://planetarymaps.usgs.gov/mosaic/Mars_MGS_MOLA_DEM_georeferenced.tif
          # Moon: USGS Astrogeology global LOLA mosaics.
          probe https://planetarymaps.usgs.gov/mosaic/Lunar_LRO_LOLA_Global_LDEM_118m_Mar2014.tif
          probe https://planetarymaps.usgs.gov/mosaic/Lunar_LRO_LOLA_ClrShade_Global_128ppd_v04.tif
          # PDS nodes, as a fallback for each.
          probe https://pds-geosciences.wustl.edu/mgs/mgs-m-mola-5-megdr-l3-v1/mgsl_300x/meg128/megt90n000fb.img
          probe https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/cylindrical/img/ldem_64.img

      - name: What the reachable rasters say about themselves
        run: |
          set +e
          # /vsicurl reads only the header ranges, not the whole file.
          for u in \
            https://planetarymaps.usgs.gov/mosaic/Mars_MGS_MOLA_DEM_mosaic_global_463m.tif \
            https://planetarymaps.usgs.gov/mosaic/Lunar_LRO_LOLA_Global_LDEM_118m_Mar2014.tif ; do
            echo "############ $u"
            GDAL_HTTP_TIMEOUT=60 gdalinfo "/vsicurl/$u" 2>&1 | head -60
            echo
          done

      - name: Directory listings, in case a name has changed
        run: |
          set +e
          for d in \
            https://planetarymaps.usgs.gov/mosaic/ \
            https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/cylindrical/img/ ; do
            echo "############ $d"
            curl -sSL --max-time 60 "$d" \
              | grep -oiE 'href="[^"]*"' | sed 's/href="//;s/"//' \
              | grep -iE 'mola|lola|ldem|megt|mars|lunar' | head -40
            echo
          done
