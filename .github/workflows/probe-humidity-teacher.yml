name: Probe humidity teacher sources

# Throwaway diagnostic, same trick Stage 3/4 used for GEBCO and NCEP: this
# sandbox's egress proxy blocks downloads.psl.noaa.gov outright, so the only
# way to find out which near-surface humidity product actually exists (and
# what its variables, grid and units are) is to ask from a runner.
# Delete this workflow once tools/build_humidity_teacher.py is settled.
#
# Round 1 (2026-09-15) returned HTTP 504 for EVERY url including the
# known-good control that Stage 3 fetched successfully, which proves it
# measured PSL's availability rather than the file list. Round 2 therefore
# uses a ranged GET with exponential backoff -- the pattern
# tools/build_wind_teacher.py already proved against this host -- rather
# than a bare HEAD, and treats a 404 (file absent) as a distinct, reportable
# outcome from a 504 (server unwilling right now).

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up python
        run: pip install --quiet numpy netCDF4

      - name: Probe candidate URLs
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, tempfile, os, time
          import netCDF4

          BASE = "https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis.derived"
          CANDIDATES = [
              # control: Stage 3 fetched this one successfully
              ("control surface pressure", f"{BASE}/surface/pres.sfc.mon.ltm.nc"),
              # near-surface specific humidity
              ("shum 2m ltm",   f"{BASE}/surface_gauss/shum.2m.mon.ltm.nc"),
              ("shum 2m mean",  f"{BASE}/surface_gauss/shum.2m.mon.mean.nc"),
              # near-surface air temperature (pairs with whichever humidity wins)
              ("air 2m ltm",    f"{BASE}/surface_gauss/air.2m.mon.ltm.nc"),
              ("air sig995 ltm", f"{BASE}/surface/air.sig995.mon.ltm.nc"),
              # relative-humidity fallback
              ("rhum sig995 ltm", f"{BASE}/surface/rhum.sig995.mon.ltm.nc"),
          ]

          def probe_head(url, attempts=5):
              """Ranged GET rather than HEAD: it exercises the same code path a
              real download uses, and distinguishes 404 from 504."""
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={"Range": "bytes=0-1023"})
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return ("ok", r.status, r.headers.get("Content-Range") or r.headers.get("Content-Length"))
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code == 404:
                          return ("absent", 404, str(e))
                      if e.code == 416:  # range not satisfiable = file exists
                          return ("ok", 416, "range refused but file present")
                  except Exception as e:
                      last = e
                  if attempt < attempts:
                      time.sleep(5 * (2 ** (attempt - 1)))
              return ("unavailable", None, str(last))

          def describe(url, attempts=4):
              last = None
              for attempt in range(1, attempts + 1):
                  fd, path = tempfile.mkstemp(suffix=".nc")
                  os.close(fd)
                  try:
                      t0 = time.time()
                      with urllib.request.urlopen(url, timeout=900) as r, open(path, "wb") as out:
                          out.write(r.read())
                      print(f"    downloaded {os.path.getsize(path)} bytes in {time.time()-t0:.0f}s")
                      ds = netCDF4.Dataset(path)
                      print(f"    dimensions: { {k: len(v) for k, v in ds.dimensions.items()} }")
                      for name, var in ds.variables.items():
                          attrs = {a: getattr(var, a) for a in var.ncattrs()
                                   if a in ("units", "long_name", "scale_factor", "add_offset",
                                            "missing_value", "actual_range", "valid_range", "level_desc")}
                          print(f"      {name} {var.dimensions} {var.dtype} {attrs}")
                      for key in ("lat", "lon", "level", "time"):
                          if key in ds.variables:
                              v = ds.variables[key][:]
                              print(f"      {key}[0:4]={list(v[:4])} ... [-2:]={list(v[-2:])} (n={len(v)})")
                      for a in ds.ncattrs():
                          s = str(getattr(ds, a))
                          if len(s) < 400:
                              print(f"    global:{a} = {s}")
                      ds.close()
                      return True
                  except Exception as e:
                      last = e
                      print(f"    attempt {attempt} failed: {e}")
                      if attempt < attempts:
                          time.sleep(10 * (2 ** (attempt - 1)))
                  finally:
                      if os.path.exists(path):
                          os.unlink(path)
              print(f"    DOWNLOAD FAILED after {attempts} attempts: {last}")
              return False

          results = {}
          for label, url in CANDIDATES:
              print("=" * 78)
              print(f"{label}: {url}")
              state, code, detail = probe_head(url)
              print(f"  reachability: {state} ({code}) {detail}")
              results[label] = state
              if state == "ok":
                  describe(url)

          print("=" * 78)
          print("SUMMARY")
          for label, state in results.items():
              print(f"  {label:24s} {state}")
          print("probe complete")
          PY
