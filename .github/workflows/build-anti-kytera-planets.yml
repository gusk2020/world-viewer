name: Build Anti-KyTerra planets

on:
  push:
    branches: [codex/anti-kyterra-mercury-venus]
    paths:
      - '.github/workflows/build-anti-kytera-planets.yml'
      - 'tools/prepare_planet_dem.py'
      - 'anti-kytera/stat/predict_planet.py'
      - 'anti-kytera/viewer/worlds/mercury/config.json'
      - 'anti-kytera/viewer/worlds/venus/config.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: GDAL and model dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin aria2 >/dev/null
          python3 -m pip install --quiet --break-system-packages numpy scipy scikit-learn pillow
      - name: Make space for the source GeoTIFFs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift || true
          df -h /
      - name: Download, validate, resample and predict
        run: |
          set -euo pipefail
          for body in mercury venus; do
            export BODY="$body"
            url=$(python3 - <<'PY'
          import json, os
          print(json.load(open(f'anti-kytera/viewer/worlds/{os.environ["BODY"]}/config.json'))['terrain']['source'])
          PY
            )
            aria2c -x 12 -s 12 -k 4M --file-allocation=none --console-log-level=warn -o source.tif "$url" \
              || curl --fail --location --retry 3 -o source.tif "$url"
            gdalinfo -json source.tif > source.json
            gdal_translate -q -of ENVI -ot Float32 -r average -outsize 2048 1024 source.tif small.bin
            python3 tools/prepare_planet_dem.py "$body" small.bin source.json
            python3 anti-kytera/stat/predict_planet.py --body "$body" \
              --bed "anti-kytera/viewer/worlds/$body/bed_2048x1024.f32" \
              $(if [ "$body" = mercury ]; then echo '--radius 2439400 --obliquity 0.034 --rotation 1'; \
                else echo '--radius 6051800 --obliquity 177.36 --rotation -1'; fi)
            python3 - <<'PY'
          import os
          from pathlib import Path
          Path(f'anti-kytera/viewer/worlds/{os.environ["BODY"]}/bed_2048x1024.f32').unlink()
          PY
            find . -maxdepth 1 -name 'source.*' -delete
            find . -maxdepth 1 -name 'small.*' -delete
          done
      - name: Commit only phone-sized assets and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anti-kytera/viewer/worlds/mercury anti-kytera/viewer/worlds/venus
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Mercury and Venus terrain and Earth-rule colouring [skip ci]'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
