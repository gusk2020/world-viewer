# Rebuilds Earth's annual-mean temperature teacher for Climate v1 (Stage 2) --
# a small, real reference to validate Climate v1's temperature field against,
# never to fit it. See docs/climate-v1-temperature-validation.md.
#
# The source file (Berkeley Earth's Land+Ocean Gridded Temperature, native
# 1x1 degree monthly, ~434 MB) is a plain public S3 object, unusually for a
# geodata host -- reachable directly from a dev session, but this workflow
# exists for the same reason every other data-fetching workflow in this
# project does: the project's owner only has a phone, so anything that ever
# needs regenerating (a newer 30-year climatology period, a corrected file
# upstream) has to be regenerable from the Actions tab. The output is one
# ~253 KB binary grid plus a small JSON summary -- nothing large is committed.
#
# Run it from the Actions tab ("Run workflow") if the climatology period
# should change, or to refresh against an updated source file.

name: Build temperature teacher data

on:
  workflow_dispatch:
    inputs:
      world:
        description: World id under worlds/ (kasoku-sekai = Earth; the only body with a real temperature teacher)
        type: choice
        options: [kasoku-sekai]
        default: kasoku-sekai
      commit:
        description: Commit the generated teacher data back to the branch
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet numpy netCDF4

      - name: Build
        run: |
          python3 tools/build_temperature_teacher.py \
            --world-dir "worlds/${{ inputs.world }}" \
            --cache "${RUNNER_TEMP}/temperature-teacher"

      - name: Commit
        if: ${{ inputs.commit }}
        env:
          world: ${{ inputs.world }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "worlds/${world}/teacher/temperature-annual-mean-c.bin" "worlds/${world}/teacher/temperature-summary.json"
          if git diff --cached --quiet; then
            echo "temperature teacher data unchanged"
            exit 0
          fi
          git commit \
            -m "Rebuild ${world} temperature teacher data" \
            -m "Generated by .github/workflows/build-temperature-teacher.yml. See tools/build_temperature_teacher.py for the source and method."
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
