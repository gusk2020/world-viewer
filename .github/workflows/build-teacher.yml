# Rebuilds a world's teacher data -- what its surface really looks like, the
# thing the climate model is scored against.
#
# It is here for the same reason the terrain workflow is: the only machine
# this project's owner has is a phone, so anything that has to be regenerated
# has to be regenerable from the Actions tab. Unlike the terrain build this
# one is quick and small -- it reads rasters already in the repo and fetches
# a couple of Natural Earth vector layers -- and it writes about 50 KB.
#
# Run it from the Actions tab ("Run workflow") after the surface photograph
# or the terrain raster changes, or when an era is added.

name: Build teacher data

on:
  workflow_dispatch:
    inputs:
      world:
        description: World id under worlds/ (kasoku-sekai = Earth)
        type: choice
        options: [kasoku-sekai]
        default: kasoku-sekai
      era:
        description: Which era to build
        type: string
        default: present
      commit:
        description: Commit the generated teacher data back to the branch
        type: boolean
        default: true

permissions:
  contents: write

env:
  # tools/*.py import elevation_encoding.py from beside them.
  PYTHONPATH: tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow numpy

      - name: Build
        env:
          WORLD: ${{ inputs.world }}
          ERA: ${{ inputs.era }}
        run: |
          set -euo pipefail
          # Never trust a dispatch input: world must be an existing directory
          # directly under worlds/, era must be declared in that world's config.
          if [[ ! "$WORLD" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] || [[ ! -d "worlds/$WORLD" ]] || [[ -L "worlds/$WORLD" ]]; then
            echo "::error::invalid world"; exit 1
          fi
          if [[ ! "$ERA" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]; then
            echo "::error::invalid era"; exit 1
          fi
          WORLD="$WORLD" ERA="$ERA" python3 - <<'PY'
          import json, os, sys
          cfg = json.load(open(f"worlds/{os.environ['WORLD']}/config.json", encoding="utf-8"))
          eras = [e["id"] for e in cfg.get("teacher", {}).get("eras", [])]
          if os.environ["ERA"] not in eras:
              sys.exit(f"::error::era not declared in config (allowed: {eras})")
          PY
          python3 tools/build_teacher.py \
            "worlds/${WORLD}" \
            --era "${ERA}" \
            --cache "${RUNNER_TEMP}/natural-earth"

      - name: Commit
        if: ${{ inputs.commit }}
        env:
          world: ${{ inputs.world }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "worlds/${world}/teacher"
          if git diff --cached --quiet; then
            echo "teacher data unchanged"
            exit 0
          fi
          git commit \
            -m "Rebuild ${world} teacher data" \
            -m "Generated by .github/workflows/build-teacher.yml. See tools/build_teacher.py for where each class comes from and how far to trust it."
          git pull --rebase origin "${REF_NAME}"
          git push origin HEAD:"${REF_NAME}"
