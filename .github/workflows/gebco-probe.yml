# Throwaway diagnostic workflow, not part of the app. It answers one
# question: can a GitHub-hosted runner reach GEBCO_2026, and in what form
# (full download / range requests / OPeNDAP server-side subsetting)?
# Delete once the real terrain pipeline is settled.

name: GEBCO probe (diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner disk space
        run: |
          df -h / /mnt 2>/dev/null || df -h
          echo "---- free space after a typical cleanup would be larger ----"

      - name: CEDA directory listing for gebco_2026
        run: |
          set +e
          for u in \
            "https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/" \
            "https://data.ceda.ac.uk/bodc/gebco/global/gebco_2026" ; do
            echo "===== GET $u"
            curl -sS -L --max-time 60 "$u" | head -c 4000
            echo
            echo "===== (status $?)"
          done

      - name: HEAD candidate bulk-download URLs
        run: |
          set +e
          for u in \
            "https://www.bodc.ac.uk/data/open_download/gebco/gebco_2026/zip/" \
            "https://www.bodc.ac.uk/data/open_download/gebco/gebco_2026/geotiff/" \
            "https://www.bodc.ac.uk/data/open_download/gebco/gebco_2026_sub_ice_topo/zip/" \
            "https://www.bodc.ac.uk/data/open_download/gebco/gebco_2025/zip/" \
            "https://www.bodc.ac.uk/data/open_download/gebco/gebco_2024/zip/" ; do
            echo "===== HEAD $u"
            curl -sS -I -L --max-time 60 "$u" | egrep -i 'HTTP/|content-length|content-type|content-disposition|accept-ranges'
            echo
          done

      - name: Probe OPeNDAP endpoints (server-side subsetting)
        run: |
          set +e
          for base in \
            "https://dap.ceda.ac.uk/thredds/dodsC/bodc/gebco/global/gebco_2026/GEBCO_2026.nc" \
            "https://dap.ceda.ac.uk/thredds/dodsC/bodc/gebco/global/gebco_2026/gebco_2026.nc" ; do
            for suffix in ".dds" ".das"; do
              echo "===== GET ${base}${suffix}"
              curl -sS -L --max-time 60 "${base}${suffix}" | head -c 1500
              echo
            done
          done
          echo "===== THREDDS catalog"
          curl -sS -L --max-time 60 "https://dap.ceda.ac.uk/thredds/catalog/bodc/gebco/global/gebco_2026/catalog.html" | head -c 3000

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin >/dev/null
          gdalinfo --version

      - name: Can GDAL read the remote grid without downloading it all?
        run: |
          set +e
          # /vsicurl/ only fetches the byte ranges it needs -- if the remote
          # GeoTIFF is tiled and carries overviews, a downsampled read is cheap.
          for u in \
            "https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/GEBCO_2026.nc" \
            "https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/gebco_2026.nc" ; do
            echo "===== HEAD $u"
            curl -sS -I -L --max-time 60 "$u" | egrep -i 'HTTP/|content-length|accept-ranges'
            echo "===== gdalinfo /vsicurl/$u"
            timeout 240 gdalinfo "/vsicurl/$u" 2>&1 | head -60
            echo
          done
