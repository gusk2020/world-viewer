# Throwaway diagnostic workflow, not part of the app. It answers one
# question: can a GitHub-hosted runner reach GEBCO_2026, and in what form
# (full download / range requests / OPeNDAP server-side subsetting)?
# Delete once the real terrain pipeline is settled.

name: GEBCO probe (diagnostic)

on:
  workflow_dispatch:

env:
  ICE_DIR: https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/ice_surface_elevation/

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List the netcdf/ and geotiff/ subdirectories
        run: |
          set +e
          for sub in netcdf geotiff; do
            echo "############ $sub/"
            curl -sS -L --max-time 60 "${ICE_DIR}${sub}/" | sed -e 's/<[^>]*>//g' | sed '/^\s*$/d'
          done

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin >/dev/null
          gdalinfo --version

      - name: Inspect the netCDF (OPeNDAP + /vsicurl)
        run: |
          set +e
          nc=$(curl -sS -L --max-time 60 "${ICE_DIR}netcdf/" \
               | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -i '\.nc$' | head -1)
          echo "nc file: [$nc]"
          [ -z "$nc" ] && exit 0

          echo "===== HEAD"
          curl -sS -I -L --max-time 60 "${ICE_DIR}netcdf/${nc}" \
            | egrep -i 'HTTP/|content-length|accept-ranges'

          dods="https://dap.ceda.ac.uk/thredds/dodsC/bodc/gebco/global/gebco_2026/ice_surface_elevation/netcdf/${nc}"
          echo "===== OPeNDAP DDS  ($dods)"
          curl -sS -L --max-time 90 "${dods}.dds" | head -c 1200
          echo
          echo "===== OPeNDAP strided subset, 6x6 sample"
          curl -sS -L --max-time 120 "${dods}.ascii?elevation[0:8000:43199][0:16000:86399]" | head -c 900
          echo
          echo "===== gdalinfo over /vsicurl"
          timeout 300 gdalinfo "/vsicurl/${ICE_DIR}netcdf/${nc}" 2>&1 | head -45

      - name: Inspect the GeoTIFF tiles (are they COGs with overviews?)
        run: |
          set +e
          tifs=$(curl -sS -L --max-time 60 "${ICE_DIR}geotiff/" \
                 | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -i '\.tif$')
          echo "tif files:"; echo "$tifs"
          first=$(echo "$tifs" | head -1)
          [ -z "$first" ] && exit 0

          echo "===== HEAD $first"
          curl -sS -I -L --max-time 60 "${ICE_DIR}geotiff/${first}" \
            | egrep -i 'HTTP/|content-length|accept-ranges'
          echo "===== gdalinfo /vsicurl (look for Overviews: and Block=)"
          timeout 300 gdalinfo "/vsicurl/${ICE_DIR}geotiff/${first}" 2>&1 | head -45

      - name: Throughput check
        run: |
          set +e
          nc=$(curl -sS -L --max-time 60 "${ICE_DIR}netcdf/" \
               | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -iE '\.(nc|zip)$' | head -1)
          [ -z "$nc" ] && exit 0
          echo "===== 300MB range read of $nc"
          curl -sS -L --max-time 300 -r 0-314572799 -o /dev/null \
            -w 'speed=%{speed_download} B/s  size=%{size_download}\n' "${ICE_DIR}netcdf/${nc}"
