# Throwaway diagnostic workflow, not part of the app. It answers one
# question: can a GitHub-hosted runner reach GEBCO_2026, and in what form
# (full download / range requests / OPeNDAP server-side subsetting)?
# Delete once the real terrain pipeline is settled.

name: GEBCO probe (diagnostic)

on:
  workflow_dispatch:

env:
  ICE_DIR: https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/ice_surface_elevation/

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List the ice_surface_elevation directory
        run: |
          set +e
          echo "===== raw listing"
          curl -sS -L --max-time 60 "$ICE_DIR" | sed -e 's/<[^>]*>//g' | sed '/^\s*$/d'

      - name: THREDDS catalog for the same directory
        run: |
          set +e
          curl -sS -L --max-time 60 \
            "https://dap.ceda.ac.uk/thredds/catalog/bodc/gebco/global/gebco_2026/ice_surface_elevation/catalog.html" \
            | sed -e 's/<[^>]*>//g' | sed '/^\s*$/d' | head -40

      - name: HEAD every file found, and measure download throughput
        run: |
          set +e
          # Pull hrefs out of the nginx autoindex, skipping the parent link.
          files=$(curl -sS -L --max-time 60 "$ICE_DIR" \
                  | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -v '^\.\./$')
          echo "discovered: $files"
          for f in $files; do
            u="${ICE_DIR}${f}"
            echo "===== HEAD $u"
            curl -sS -I -L --max-time 60 "$u" | egrep -i 'HTTP/|content-length|accept-ranges|content-type'
          done

          # Throughput on the first .nc found -- tells us whether pulling the
          # whole grid in CI is practical, versus needing server-side subsetting.
          nc=$(echo "$files" | tr ' ' '\n' | grep -i '\.nc$' | head -1)
          if [ -n "$nc" ]; then
            echo "===== 200MB range read of $nc"
            curl -sS -L --max-time 300 -r 0-209715199 -o /dev/null \
              -w 'speed=%{speed_download} B/s  size=%{size_download}\n' "${ICE_DIR}${nc}"
          fi

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin >/dev/null
          gdalinfo --version

      - name: Try OPeNDAP and /vsicurl reads on the real file
        run: |
          set +e
          files=$(curl -sS -L --max-time 60 "$ICE_DIR" \
                  | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -v '^\.\./$')
          nc=$(echo "$files" | tr ' ' '\n' | grep -i '\.nc$' | head -1)
          echo "nc file: $nc"

          if [ -n "$nc" ]; then
            dods="https://dap.ceda.ac.uk/thredds/dodsC/bodc/gebco/global/gebco_2026/ice_surface_elevation/${nc}"
            echo "===== OPeNDAP DDS"
            curl -sS -L --max-time 90 "${dods}.dds" | head -c 1200
            echo
            echo "===== OPeNDAP strided subset (every 400th cell, as ASCII)"
            curl -sS -L --max-time 120 "${dods}.ascii?elevation[0:400:43199][0:400:86399]" | head -c 600
            echo
            echo "===== gdalinfo over /vsicurl (range reads only)"
            timeout 300 gdalinfo "/vsicurl/${ICE_DIR}${nc}" 2>&1 | head -40
          fi
