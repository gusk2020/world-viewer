# Rebuilds Earth's annual-mean wind teacher for Climate v1 Stage 3 -- see
# docs/climate-v1-wind-validation.md. NCEP/NCAR Reanalysis 1's PSL host is
# blocked from this project's usual dev sandbox, the same as every other
# dedicated geodata host this project has ever used (GEBCO, the planetary
# DEMs, the Koppen classification, Berkeley Earth's temperature file was the
# one exception) -- so, same as those, this workflow does the actual
# fetching from a GitHub Actions runner. Run it from the Actions tab.

name: Build wind teacher data

on:
  workflow_dispatch:
    inputs:
      world:
        description: World id under worlds/ (kasoku-sekai = Earth; the only body with a real wind teacher)
        type: choice
        options: [kasoku-sekai]
        default: kasoku-sekai
      commit:
        description: Commit the generated teacher data back to the branch
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet numpy netCDF4

      - name: Build
        run: |
          python3 tools/build_wind_teacher.py \
            --world-dir "worlds/${{ inputs.world }}" \
            --cache "${RUNNER_TEMP}/wind-teacher"

      - name: Commit
        if: ${{ inputs.commit }}
        env:
          world: ${{ inputs.world }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "worlds/${world}/teacher/"wind-*-ms.bin \
                   "worlds/${world}/teacher/wind-summary.json"
          if git diff --cached --quiet; then
            echo "wind teacher data unchanged"
            exit 0
          fi
          git commit \
            -m "Rebuild ${world} wind teacher data" \
            -m "Generated by .github/workflows/build-wind-teacher.yml. See tools/build_wind_teacher.py for the source and method."
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
