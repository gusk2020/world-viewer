# Anti-KyTerra vegetation: fetch the potential natural vegetation teacher
# (Ramankutty & Foley 1999, SAGE, 0.5 deg) on a runner, because the dev
# sandbox cannot reach sage.nelson.wisc.edu.
#
# Out: anti-kytera/veg/data/pnv_0.5deg.png (8-bit class codes 1..15, 0 = no
#      data/water; row 0 = NORTH as in the source, flipped to south-first by
#      the Python side) and anti-kytera/veg/data/source_page.txt (the dataset
#      page text, kept as the record of the stated terms/citation).

name: Anti-KyTerra vegetation teacher

on:
  workflow_dispatch:
  push:
    branches: [claude/anti-kytera-vegetation]
    paths: [.github/workflows/anti-kytera-veg-teacher.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Tools
        run: python3 -m pip install --quiet --break-system-packages numpy pillow netCDF4 scipy
      - name: Find and download
        run: |
          set -x
          mkdir -p dl && cd dl
          for P in https://sage.nelson.wisc.edu/data-and-models/datasets/global-potential-vegetation-dataset/ \
                   https://sage.nelson.wisc.edu/data-and-models/datasets/global-potential-vegetation-dataset/netcdf/ \
                   https://sage.nelson.wisc.edu/data-and-models/datasets/global-potential-vegetation-dataset/netcdf-0-5-degree/ \
                   https://nelson.wisc.edu/sage/data-and-models/global-potential-vegetation/index.php ; do
            curl -sSL -A Mozilla/5.0 "$P" >> pages.html || true
          done
          grep -oiE 'href="[^"]+"' pages.html | sed 's/href="//I;s/"$//' | sort -u > links.txt
          grep -iE 'veg|potential|\.zip|\.gz|\.nc|\.tar' links.txt || true
          for L in $(grep -iE '\.(zip|gz|tgz|tar|nc)$' links.txt); do
            case "$L" in http*) U="$L";; /*) U="https://sage.nelson.wisc.edu$L";; *) continue;; esac
            curl -sSL -A Mozilla/5.0 -O "$U" || true
          done
          # subpages that look like download pages
          for L in $(grep -iE 'potential-vegetation' links.txt | grep -E '^http' ); do
            curl -sSL -A Mozilla/5.0 "$L" | grep -oiE 'href="[^"]+\.(zip|gz|tgz|tar|nc)"' | sed 's/href="//I;s/"$//' >> more.txt || true
          done
          sort -u more.txt 2>/dev/null | while read L; do curl -sSL -A Mozilla/5.0 -O "$L" || true; done
          ls -la
          for f in *.zip; do [ -f "$f" ] && unzip -o -q "$f" || true; done
          for f in *.tgz *.tar.gz *.tar; do [ -f "$f" ] && tar xf "$f" || true; done
          find . -name '*.gz' -name '*veg*' -exec gunzip -kf {} \; || true
          find . -type f | head -50
          python3 - <<'PY'
          import re,html
          t=open('pages.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'(?s)<script.*?</script>|<style.*?</style>','',t)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          open('page.txt','w').write(t)
          PY
      - name: Convert
        run: |
          python3 - <<'PY'
          import glob, numpy as np, netCDF4
          from PIL import Image
          fs=[f for f in glob.glob('dl/**/*',recursive=True) if f.endswith('.nc') and 'veg' in f.lower()]
          print(fs)
          f=[f for f in fs if '0.5' in f] or fs
          d=netCDF4.Dataset(f[0]); print(d)
          for k,v in d.variables.items(): print(k,v.shape,v.dtype, getattr(v,'long_name',''))
          name=[k for k,v in d.variables.items() if v.ndim>=2][0]
          a=np.squeeze(np.ma.filled(d.variables[name][:],0)).astype(float)
          lat=[k for k in d.variables if k.lower().startswith('lat')]
          if lat:
              la=d.variables[lat[0]][:]; print('lat first/last',la[0],la[-1])
              if la[0]<la[-1]: a=a[::-1]      # store north-first
          if a.shape!=(360,720):
              from scipy.stats import mode
              fy=a.shape[0]//360; fx=a.shape[1]//720
              a=mode(a.reshape(360,fy,720,fx).transpose(0,2,1,3).reshape(360,720,-1),axis=2,keepdims=False).mode
          a=np.where((a>=1)&(a<=15),a,0).astype(np.uint8)
          print(np.bincount(a.ravel(),minlength=16))
          Image.fromarray(a).save('anti-kytera/veg/data/pnv_0.5deg.png')
          PY
          cp dl/page.txt anti-kytera/veg/data/source_page.txt
          cp dl/links.txt anti-kytera/veg/data/source_links.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anti-kytera/veg/data
          git commit -m "Anti-KyTerra vegetation: potential natural vegetation teacher (Ramankutty & Foley, 0.5 deg)" || exit 0
          git push
