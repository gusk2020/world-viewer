# Builds Teacher B -- the real-Earth climate *structure* (season, monsoon,
# wet/dry cycle), reduced to eight classes -- for scoring the climate model's
# season/wind/rain-shadow machinery, which the existing four-class teacher
# (build-teacher.yml) is shown to barely see at all. See
# docs/climate-model-diagnosis-after-stage7_5.md for why this exists, and
# tools/build_koppen_teacher.py for where the data comes from and how it is
# reduced.
#
# This runs from Actions, not the phone and not the dev sandbox, for the same
# reason build-terrain.yml does: the source (a figshare-hosted scientific
# dataset) is one of the dedicated geo-data hosts this project's own sandbox
# cannot reach, while a GitHub runner has ordinary internet access.

name: Build Köppen structure teacher (Teacher B)

on:
  workflow_dispatch:
    inputs:
      world:
        description: World id under worlds/ (kasoku-sekai = Earth)
        type: choice
        options: [kasoku-sekai]
        default: kasoku-sekai
      commit:
        description: Commit the generated teacher data back to the branch
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHONPATH: tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow numpy

      - name: Build
        run: |
          python3 tools/build_koppen_teacher.py \
            "worlds/${{ inputs.world }}" \
            --cache "${RUNNER_TEMP}/koppen-cache"

      - name: Commit
        if: ${{ inputs.commit }}
        env:
          world: ${{ inputs.world }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "worlds/${world}/teacher/koppen-structure.png" \
                  "worlds/${world}/teacher/koppen-structure-summary.json"
          if git diff --cached --quiet; then
            echo "Teacher B data unchanged"
            exit 0
          fi
          git commit \
            -m "Rebuild ${world} Teacher B (climate structure) data" \
            -m "Generated by .github/workflows/build-koppen-teacher.yml. See tools/build_koppen_teacher.py for provenance and the reduction from 30 Koppen classes to 8 structural groups."
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
